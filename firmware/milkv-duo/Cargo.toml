[package]
name = "vibeos-firmware-milkv-duo"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
# Reusable services; this firmware selects the appropriate entropy provider.
provisioned-ssh = ["vibeos-kernel/provisioned-ssh", "vibeos-kernel/jitter-entropy"]
provisioned-command = ["provisioned-ssh", "vibeos-kernel/provisioned-command"]
provisioned-wasmtime = ["provisioned-command", "vibeos-kernel/provisioned-wasmtime"]
dhcp-iperf3-server = ["vibeos-kernel/dhcp-iperf3-server"]

python = ["vibeos-kernel/milkv-python"]
wasmtime = ["vibeos-kernel/milkv-wasmtime"]
wasmtime-benchmark = ["wasmtime", "vibeos-kernel/wasi-long-fuel"]
default = ["milkv-ssh"]
net-shell = ["vibeos-kernel/net-shell"]
milkv-iperf3-server = ["vibeos-kernel/milkv-iperf3-server"]
milkv-ssh = ["vibeos-kernel/milkv-ssh"]
file-tree = ["vibeos-kernel/file-tree"]
legacy-shell = ["vibeos-kernel/legacy-shell"]
milkv-ssh-acceptance = ["vibeos-kernel/milkv-ssh-acceptance"]
milkv-jitterentropy-probe = ["vibeos-kernel/milkv-jitterentropy-probe"]
milkv-jitterentropy-ssh-probe = ["vibeos-kernel/milkv-jitterentropy-ssh-probe"]
wasm-c83-runtime-costs = ["vibeos-kernel/wasm-c83-runtime-costs"]
wasm-c88-f5-float-duo-compile-readiness = [
    "vibeos-kernel/wasm-c88-f5-float-duo-compile-readiness",
]
wasm-c84-profile-slot = ["vibeos-kernel/wasm-c84-profile-slot"]
wasm-c84-core-poll-observer = ["vibeos-kernel/wasm-c84-core-poll-observer"]
wasm-c84-profile-irq-overlay = ["vibeos-kernel/wasm-c84-profile-irq-overlay"]
wasm-c84-profile-child-delegation = ["vibeos-kernel/wasm-c84-profile-child-delegation"]
wasm-c84-ssh-request-parent = ["vibeos-kernel/wasm-c84-ssh-request-parent"]
wasm-c84-ssh-managed-child-core = ["vibeos-kernel/wasm-c84-ssh-managed-child-core"]
wasm-c84-ssh-managed-child-phase-sidecar = ["vibeos-kernel/wasm-c84-ssh-managed-child-phase-sidecar"]
wasm-c84-ssh-managed-child-irq-overlay = ["vibeos-kernel/wasm-c84-ssh-managed-child-irq-overlay"]
wasm-c84-ssh-managed-child-finish-verify = ["vibeos-kernel/wasm-c84-ssh-managed-child-finish-verify"]
wasm-c84-ssh-managed-child-trusted-sample = ["vibeos-kernel/wasm-c84-ssh-managed-child-trusted-sample"]
# Closed physical image: production Milk-V SSH plus the build-bound private
# single-cold-boot collector and atomic formal UART sink.
wasm-c84-ssh-managed-child-single-boot-collector = [
    "milkv-ssh",
    "vibeos-kernel/wasm-c84-ssh-managed-child-single-boot-collector",
]
wasm-c84-ssh-managed-child-verified-stream = ["vibeos-kernel/wasm-c84-ssh-managed-child-verified-stream"]

[[bin]]
name = "vibeos-milkv-duo"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vibeos-kernel = { path = "../../kernel", default-features = false, features = ["milkv-duo", "milkv-duo-sd-image"] }
vibeos-hal = { path = "../../hal" }
vibeos-bsp-milkv-duo = { path = "../../boards/milkv-duo" }
vibeos-driver-uart16550 = { path = "../../drivers/uart16550" }
vibeos-driver-plic = { path = "../../drivers/plic" }
vibeos-driver-sdhci-blk = { path = "../../drivers/sdhci-blk" }
vibeos-platform-cv1800b = { path = "../../platform/cv1800b" }
vibeos-driver-dwmac-net = { path = "../../drivers/dwmac-net" }
vibeos-driver-milkv-duo-led = { path = "../../drivers/milkv-duo-led" }
vibeos-driver-dwc2-host = { path = "../../drivers/dwc2-host" }
