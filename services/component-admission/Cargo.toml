[package]
name = "vibeos-component-admission"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
vibeos-component-format = { path = "../../component-format" }
vibeos-component-host = { path = "../component-host" }
vibeos-component-runtime = { path = "../../component-runtime" }
vibeos-core = { path = "../../core" }
vibeos-wasm-runtime = { path = "../../wasm-runtime" }
wasmparser = { version = "=0.255.0", default-features = false, features = ["component-model", "features", "prefer-btree-collections", "validate"], optional = true }

[features]
default = []
native-async-acceptance = ["vibeos-component-runtime/native-async-acceptance"]
preview1-wrapped-admission = ["dep:wasmparser"]
# Default-off C8.2 corpus executor. It consumes only a freshly revalidated
# Preview1-wrapped artifact and does not activate the profile/runtime-ready bit.
preview1-corpus-acceptance = ["preview1-wrapped-admission"]
selected-wasi-admission = []

[dev-dependencies]
vibeos-c82-preview1-corpus = { path = "../../tools/c82-preview1-corpus" }
wat = { version = "=1.255.0", features = ["component-model"] }
