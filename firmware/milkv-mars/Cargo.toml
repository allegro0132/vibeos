[package]
name = "vibeos-firmware-milkv-mars"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["image"]
image = ["dep:vibeos-kernel", "dep:vibeos-runtime-riscv", "dep:vibeos-image-policy"]
# Hardware assembly is independent of the selected network service image.
ethernet-device = ["dep:vibeos-eqos-net", "dep:vibeos-ethernet"]
# Compatibility profile used by --ethernet build/package commands.
ethernet = ["ethernet-device", "vibeos-kernel?/dhcp-iperf3-server"]

# Install a retained, unstarted native owner; source approval is separate.
entropy-device = ["dep:vibeos-starfive-trng", "vibeos-kernel?/queued-entropy"]
# Compatibility diagnostic explicitly exercises and stops that owner at boot.
trng-probe = ["entropy-device"]

[lib]
path = "src/lib.rs"

[[test]]
name = "entropy_model"
path = "tests/entropy_model.rs"
required-features = ["entropy-device"]

[[bin]]
name = "vibeos-milkv-mars"
path = "src/main.rs"
test = false
bench = false
required-features = ["image"]

[dependencies]
vibeos-hal = { path = "../../hal" }
vibeos-bsp-milkv-mars = { path = "../../boards/milkv-mars" }
vibeos-platform-jh7110 = { path = "../../platform/jh7110" }
vibeos-driver-uart16550 = { path = "../../drivers/uart16550" }
vibeos-driver-plic = { path = "../../drivers/plic" }
vibeos-driver-dw-mshc = { path = "../../drivers/dw-mshc" }
vibeos-eqos-net = { path = "../../drivers/eqos-net", optional = true }
vibeos-ethernet = { path = "../../drivers/ethernet", optional = true }

vibeos-starfive-trng = { path = "../../drivers/starfive-trng", optional = true }

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
vibeos-kernel = { path = "../../kernel", optional = true, default-features = false, features = ["pio-block", "packet-network", "bounded-device-image", "legacy-shell", "wasi-preview1"] }
vibeos-runtime-riscv = { path = "../../runtime/riscv", optional = true }
vibeos-image-policy = { path = "../../policy/image", default-features = false, features = ["bounded-device"], optional = true }
