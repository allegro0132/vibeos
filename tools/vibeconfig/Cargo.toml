[package]
name = "vibeos-config"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.11"
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29", optional = true }

[[bin]]
name = "vibeconfig"
path = "src/main.rs"

