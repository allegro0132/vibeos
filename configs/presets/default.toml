# VibeOS build configuration. Edit this file or run ./configure.sh.
version = 1
boards = [
    "milkv-duo",
    "milkv-mars",
    "qemu-virt",
]
components = [
    "file-tree",
    "network",
    "vsh",
]

[drivers]
dw-mshc = "on"
dwmac-net = "on"
eqos-net = "on"
sdhci-blk = "on"
virtio-blk = "on"
virtio-net = "on"
