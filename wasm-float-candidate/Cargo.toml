[package]
name = "vibeos-wasm-float-candidate"
version = "0.1.0"
edition = "2021"
publish = false
description = "C8.8-F2 acceptance-only deterministic scalar-float candidate"
license = "MIT OR Apache-2.0"

[features]
default = []
c88-f2-acceptance = ["dep:vibeos-wasm-runtime", "dep:wasmi-softfloat"]
c89-executable = ["dep:vibeos-wasm-runtime", "dep:wasmi-softfloat", "vibeos-wasm-runtime/c89-float-executable"]

[dependencies]
vibeos-component-format = { path = "../component-format" }
vibeos-wasm-runtime = { path = "../wasm-runtime", optional = true }
wasmi-softfloat = { package = "vibeos-wasmi-softfloat", path = "../vendor/wasmi-softfloat/crates/wasmi", default-features = false, features = ["extra-checks", "prefer-btree-collections"], optional = true }

[dev-dependencies]
softfloat-core = { package = "vibeos-wasmi-core-softfloat", path = "../vendor/wasmi-softfloat/crates/core", default-features = false }
wat = { version = "=1.255.0", default-features = false }
