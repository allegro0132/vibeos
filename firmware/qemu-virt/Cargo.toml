[package]
name = "vibeos-firmware-qemu-virt"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = []
file-tree = ["vibeos-kernel/file-tree"]
legacy-shell = ["vibeos-kernel/legacy-shell"]
# Dedicated guest-path storage qualification image. Keeping this as one named
# feature prevents benchmark builds from silently omitting the V2 file-tree
# policy while preserving the production storage and capability paths.
storage-bench = ["legacy-shell", "file-tree", "vibeos-kernel/storage-bench"]
tcp-echo = ["vibeos-kernel/tcp-echo"]
tcp-echo-recovery-test = ["vibeos-kernel/tcp-echo-recovery-test"]
iperf3-server = ["vibeos-kernel/iperf3-server"]
wasm-c63-graph-principal-acceptance = [
    "vibeos-kernel/wasm-c63-graph-principal-acceptance",
]
wasm-c64-resource-route-acceptance = [
    "vibeos-kernel/wasm-c64-resource-route-acceptance",
]
wasm-c65-async-chain-acceptance = [
    "vibeos-kernel/wasm-c65-async-chain-acceptance",
]
wasm-c66-node-replacement-acceptance = [
    "vibeos-kernel/wasm-c66-node-replacement-acceptance",
]
wasm-c67-information-flow-acceptance = [
    "vibeos-kernel/wasm-c67-information-flow-acceptance",
]
wasm-c73-authenticated-admission-acceptance = [
    "vibeos-kernel/wasm-c73-authenticated-admission-acceptance",
]
wasm-c74-crash-safe-publication-acceptance = [
    "vibeos-kernel/wasm-c74-crash-safe-publication-acceptance",
]
ssh-security-test = ["vibeos-kernel/ssh-security-test"]
ssh-test = [
    "vibeos-kernel/ssh-test",
    "vibeos-kernel/wasm-c48-qemu-acceptance",
]
# Explicitly default-off standard OpenSSH gate for the formal managed native
# command. It retains every existing ssh-test/C4.8 assertion in one image.
ssh-native-async-qemu-acceptance = [
    "ssh-test",
    "vibeos-kernel/ssh-native-async-qemu-acceptance",
]
# Explicitly separate from the standard formal-native gate: C5.4c deliberately
# runs destructive linearization/fault scenarios in independent QEMU boots.
ssh-native-async-revoke-qemu-acceptance = [
    "ssh-test",
    "vibeos-kernel/ssh-native-async-revoke-qemu-acceptance",
]

[[bin]]
name = "vibeos-qemu-virt"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vibeos-kernel = { path = "../../kernel", default-features = false, features = ["qemu-virt", "qemu-default-image"] }
