[package]
name = "vibeos-wasmi-core-softfloat"
version = "1.1.0-vibeos-f2.1"
edition = "2021"
rust-version = "1.86"
publish = false
description = "C8.8-F2 deterministic software-float fork of wasmi_core 1.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wasmi-labs/wasmi"

[lib]
name = "wasmi_core"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
simd = ["dep:libm"]

[dependencies]
libm = { version = "=0.2.16", default-features = false, optional = true }
rustc_apfloat = { version = "=0.2.3", default-features = false }
