[package]
name = "vibeos-kernel"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["qemu-virt"]
qemu-virt = []
milkv-duo = []
legacy-shell = []

# The kernel is `no_std` and cannot link a host test harness. Its tests live in
# `selftest.rs` and run inside QEMU; `cargo test --workspace` must skip it.
[[bin]]
name = "vibeos-kernel"
path = "src/main.rs"
test = false

[dependencies]
vibeos-core = { path = "../core" }
vibeos-rustc = { path = "../compiler" }
