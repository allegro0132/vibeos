[package]
name = "vibeos-wasm-simd-executable"
version = "0.1.0"
edition = "2021"
publish = false
description = "C8.11-S2 independently numbered executable fixed-SIMD runtime"
license = "MIT OR Apache-2.0"

[features]
default = []
c811-s2-acceptance = ["dep:wasmi-simd-executable"]

[dependencies]
vibeos-component-format = { path = "../component-format" }
wasmi-simd-executable = { package = "vibeos-wasmi-simd-executable-softfloat", path = "../wasmi-simd-executable-softfloat", version = "=1.1.0-vibeos-simd2.1", default-features = false, features = ["extra-checks", "prefer-btree-collections", "simd"], optional = true }

[dev-dependencies]
wat = { version = "=1.255.0", default-features = false }
