[package]
name = "vibeos-netstack"
version = "0.1.0"
edition = "2021"

[features]
tx-lease-profile = ["vibeos-net-protocol/tx-lease-profile"]
skip-empty-service = ["vibeos-net-protocol/skip-empty-service"]
# Experimental protocol binding; firmware assembly remains disabled.
receive-buffer-exchange = ["vibeos-net-protocol/receive-buffer-exchange"]
event-driven = ["vibeos-net-api/activity-events"]
pooled-rx = ["vibeos-net-protocol/pooled-rx"]
network-tx-audit = ["vibeos-net-protocol/network-tx-audit"]
native-tcp-segmentation = ["vibeos-net-protocol/native-tcp-segmentation"]
# Experimental bounded IPv4/TCP receive coalescing; disabled by default.
bounded-gro = ["vibeos-net-protocol/bounded-gro"]
tcp-large-window = ["vibeos-net-protocol/tcp-large-window"]
default = ["tcp-echo"]
static-service = []
dhcp-service = []
tcp-echo = ["static-service"]
net-shell = ["dhcp-service"]
tcp-echo-recovery-test = ["tcp-echo"]

[dependencies]
vibeos-core = { path = "../../core" }
vibeos-net-api = { path = "../net-api" }
vibeos-net-protocol = { path = "../net-protocol" }
vibeos-vsh = { path = "../vsh", default-features = false }
