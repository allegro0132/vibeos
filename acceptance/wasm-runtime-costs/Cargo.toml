[package]
name = "vibeos-wasm-runtime-costs"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
vibeos-component-format = { path = "../../component-format" }
vibeos-component-runtime = { path = "../../component-runtime" }
vibeos-core = { path = "../../core", features = ["wasm-c83-runtime-costs"] }
vibeos-wasm-runtime = { path = "../../wasm-runtime" }

[build-dependencies]
sha2 = { version = "=0.11.0", default-features = false }
wat = { version = "=1.255.0", features = ["component-model"] }
