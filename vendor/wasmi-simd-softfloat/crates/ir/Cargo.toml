[package]
name = "vibeos-wasmi-ir-simd-softfloat"
version = "1.1.0-vibeos-simd1.1"
edition = "2021"
rust-version = "1.86"
publish = false
description = "C8.10-S2 deterministic SIMD software-float fork of wasmi_ir 1.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wasmi-labs/wasmi"

[lib]
name = "wasmi_ir"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["wasmi_core/std"]
simd = ["wasmi_core/simd"]

[dependencies.wasmi_core]
package = "vibeos-wasmi-core-simd-softfloat"
path = "../core"
version = "=1.1.0-vibeos-simd1.1"
default-features = false
