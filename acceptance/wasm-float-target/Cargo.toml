[package]
name = "vibeos-wasm-float-target"
version = "0.1.0"
edition = "2021"
publish = false
description = "C8.8-F5 host and target scalar-float qualification"
license = "MIT OR Apache-2.0"

[features]
default = []
c88-f5-acceptance = [
    "dep:sha2",
    "dep:vibeos-component-format",
    "dep:vibeos-component-image-adapter",
    "dep:vibeos-component-runtime",
    "dep:vibeos-image-policy",
    "dep:vibeos-wasm-float-candidate",
    "dep:vibeos-wasm-runtime",
    "dep:wat",
    "vibeos-component-image-adapter/c88-f4-float-candidate",
    "vibeos-component-runtime/c88-f4-acceptance",
    "vibeos-image-policy/c88-f4-float-candidate",
    "vibeos-image-policy/qemu-default",
    "vibeos-wasm-float-candidate/c88-f2-acceptance",
]

[dependencies]
sha2 = { version = "=0.11.0", default-features = false, optional = true }
vibeos-component-format = { path = "../../component-format", optional = true }
vibeos-component-image-adapter = { path = "../../services/component-image-adapter", default-features = false, optional = true }
vibeos-component-runtime = { path = "../../component-runtime", optional = true }
vibeos-image-policy = { path = "../../policy/image", default-features = false, optional = true }
vibeos-wasm-float-candidate = { path = "../../wasm-float-candidate", default-features = false, optional = true }
vibeos-wasm-runtime = { path = "../../wasm-runtime", optional = true }

[build-dependencies]
sha2 = { version = "=0.11.0", default-features = false, optional = true }
wat = { version = "=1.255.0", default-features = false, optional = true }
