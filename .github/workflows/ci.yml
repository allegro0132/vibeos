name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rust-src --component llvm-tools-preview
          {
            echo "VIBEOS_TOOLCHAIN=$toolchain"
            echo "VIBEOS_RUSTC=$(rustup which --toolchain "$toolchain" rustc)"
            echo "VIBEOS_RUSTDOC=$(rustup which --toolchain "$toolchain" rustdoc)"
          } >> "$GITHUB_ENV"
          rustup run "$toolchain" rustc -Vv
          rustup run "$toolchain" cargo -V
      - name: Test the portable core, compiler, and Sunset fork
        # The kernel archive and final firmware binaries are no_std; their
        # tests run inside QEMU in the job below.
        run: |
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test --workspace \
              --exclude vibeos-kernel \
              --exclude vibeos-firmware-qemu-virt \
              --exclude vibeos-firmware-milkv-duo --verbose
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test \
              --manifest-path vendor/sunset/Cargo.toml -p sunset \
              --no-default-features --features alloc --verbose
      - name: Test the native async state-machine evidence
        # The kernel library has `test = false`, but this model deliberately
        # has no kernel dependencies and is a portable host evidence layer.
        # The component-runtime fuzzer is feature-gated, so the workspace's
        # default test command above does not discover it.
        run: |
          "$VIBEOS_RUSTC" --edition=2021 --test \
            kernel/src/native_pending_shadow_model.rs \
            -o "$RUNNER_TEMP/native-pending-shadow-model"
          "$RUNNER_TEMP/native-pending-shadow-model"
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test \
              -p vibeos-component-runtime \
              --features native-async-acceptance \
              --test native_async_fuzz --verbose
      - name: Test the default-off C8.4 Core profiling boundary
        run: |
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test --locked \
              -p vibeos-component-runtime --no-default-features \
              --features c84-profile-hooks \
              --test c84_profile --verbose
      - name: Test the C8.4 trusted SSH terminal seam
        run: |
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test --locked \
              -p vibeos-sshd --no-default-features \
              --features c84-profile-trusted-sample,native-revoke-target-acceptance \
              --verbose
      - name: Test the allocation-free C8.4 phase ledger
        run: |
          rustup target add --toolchain "$VIBEOS_TOOLCHAIN" \
            riscv64imac-unknown-none-elf
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test --locked \
              -p vibeos-wasm-aot-profile --verbose
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo check --locked \
              -p vibeos-wasm-aot-profile --target \
              riscv64imac-unknown-none-elf --verbose
      - name: Test each image policy and the frozen C8.4 capacity preflight
        run: |
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test --locked \
              -p vibeos-image-policy --no-default-features \
              --features qemu-default --verbose
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test --locked \
              -p vibeos-image-policy --no-default-features \
              --features milkv-duo-sd --verbose
      - name: Verify the C8.8-F5 fixed-QEMU replacement decision
        run: |
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test --locked --offline \
              -p vibeos-wasm-float-target --no-default-features \
              --features c88-f5-acceptance --verbose
          python3 -B scripts/verify-c88-f5-qemu-target-gate.py \
            --check-contract
          python3 -O -B scripts/verify-c88-f5-qemu-target-gate.py \
            --check-contract
          python3 -B scripts/verify-c88-f5-qemu-target-gate.py \
            --selftest
          python3 -O -B scripts/verify-c88-f5-qemu-target-gate.py \
            --selftest
          python3 -B scripts/verify-c88-f5-qemu-target-gate.py \
            --check-decision \
            acceptance/wasm-float-target/artifacts/qualification-qemu-target-gate-v1-decision.json \
            --normal-receipt \
            acceptance/wasm-float-target/artifacts/qualification-qemu-target-gate-v1-normal-receipt.json \
            --optimized-receipt \
            acceptance/wasm-float-target/artifacts/qualification-qemu-target-gate-v1-optimized-receipt.json
          python3 -O -B scripts/verify-c88-f5-qemu-target-gate.py \
            --check-decision \
            acceptance/wasm-float-target/artifacts/qualification-qemu-target-gate-v1-decision.json \
            --normal-receipt \
            acceptance/wasm-float-target/artifacts/qualification-qemu-target-gate-v1-normal-receipt.json \
            --optimized-receipt \
            acceptance/wasm-float-target/artifacts/qualification-qemu-target-gate-v1-optimized-receipt.json
      - name: Verify the C8.8-F2 current candidate-consumer closure
        # Offline acceptance-only fail-closed proof. This does not activate
        # profile code 5 or authorize implementation or production.
        run: |
          python3 -B scripts/verify-c88-f2-supply-chain.py
          python3 -O -B scripts/verify-c88-f2-supply-chain.py
          python3 -B scripts/verify-c88-f2-supply-chain.py --self-test
          python3 -O -B scripts/verify-c88-f2-supply-chain.py --self-test
      - name: Verify the unallocated Float successor review boundary
        # Charter integrity only: no successor identity or engine is selected,
        # and no implementation, execution, admission, or production is authorized.
        run: |
          python3 -B scripts/verify-c88-float-successor-review-boundary.py \
            --check-contract
          python3 -O -B scripts/verify-c88-float-successor-review-boundary.py \
            --check-contract
          python3 -B scripts/verify-c88-float-successor-review-boundary.py \
            --selftest
          python3 -O -B scripts/verify-c88-float-successor-review-boundary.py \
            --selftest
      - name: Verify the C8.9-S1 Float successor design
        # Design identity only: code 5 remains inert, code 6 is not yet
        # materialized, and neither QEMU nor physical hardware is run here.
        run: |
          python3 -B scripts/verify-c89-float-successor-design.py --check-contract
          python3 -O -B scripts/verify-c89-float-successor-design.py --check-contract
          python3 -B scripts/verify-c89-float-successor-design.py --selftest
          python3 -O -B scripts/verify-c89-float-successor-design.py --selftest
      - name: Verify the prospective fixed-QEMU WASM target/release policy
        # Policy/contract integrity only: no QEMU or Duo is run, no target or
        # release gate is satisfied. C8.9 allocation is verified separately.
        run: |
          python3 -B scripts/verify-wasm-fixed-qemu-target-release-policy.py --check-contract
          python3 -O -B scripts/verify-wasm-fixed-qemu-target-release-policy.py --check-contract
          python3 -B scripts/verify-wasm-fixed-qemu-target-release-policy.py --selftest
          python3 -O -B scripts/verify-wasm-fixed-qemu-target-release-policy.py --selftest
      - name: Verify the retained C8.8-F5 Duo non-evidence contracts
        # Retained compile/schema integrity only. Physical Duo completion is
        # paused and is not a C8.8-F5 roadmap gate.
        run: |
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test --locked --offline \
              -p vibeos-wasm-float-target --no-default-features \
              --features c88-f5-duo-compile-readiness --verbose
          python3 -B scripts/verify-c88-f5-duo-readiness.py
          python3 -B scripts/verify-c88-f5-duo-readiness.py --selftest
          python3 -B scripts/verify-c88-f5-duo-physical-transcript.py \
            --check-contract
          python3 -O -B scripts/verify-c88-f5-duo-physical-transcript.py \
            --check-contract
          python3 -B scripts/verify-c88-f5-duo-physical-transcript.py \
            --selftest
          python3 -O -B scripts/verify-c88-f5-duo-physical-transcript.py \
            --selftest
      - name: Report repository status
        run: ./scripts/status.sh --check
      - name: Exercise SMP benchmark transcript validation
        run: python3 -B scripts/bench.py --selftest
      - name: Verify the C0.7 candidate baseline contract
        run: |
          python3 -B scripts/verify-c0-baseline.py --selftest --check-toolchain
          python3 -B scripts/collect-c0-baseline.py --check-build
      - name: Verify the independent C8.3 runtime-cost evidence boundary
        run: |
          python3 -B scripts/verify-c83-runtime-costs.py --selftest --check-manifest
          python3 -B scripts/capture-c83-duo-runtime-costs.py --selftest
          python3 -B scripts/verify-c83-evidence.py --selftest
      - name: Verify the published fixed-QEMU C8.4 replacement gate
        # Historical structure/hash integrity only: this neither boots QEMU
        # nor replays the publication-time host custody.
        run: |
          python3 -B scripts/verify-c84-qemu-published-evidence.py \
            --check-published
          python3 -O -B scripts/verify-c84-qemu-published-evidence.py \
            --check-published
          python3 -B scripts/verify-c84-qemu-published-evidence.py \
            --selftest
          python3 -O -B scripts/verify-c84-qemu-published-evidence.py \
            --selftest
      - name: Verify the retained C8.4 Duo non-evidence tooling
        # Tooling integrity only. Physical execution remains paused and is
        # not a C8.4 roadmap or evidence gate.
        run: |
          bash -n scripts/build-milkv-duo.sh
          bash -n scripts/package-milkv-duo-sdk.sh
          bash -n scripts/verify-milkv-duo-image.sh
          python3 -B scripts/c84-source-materialization.py --selftest --check-source
          python3 -B scripts/c84-docker-runtime.py --selftest
          ./scripts/verify-milkv-duo-image.sh --selftest
          python3 -B scripts/capture-c84-duo-aot-decision.py --selftest
          python3 -B scripts/verify-c84-evidence.py --selftest
      - name: Verify the C8.4 formal single-SAMPLE publisher
        run: python3 -B scripts/verify-c84-profile-publisher.py --selftest --check-source
      - name: Verify the C8.4 trusted live-sample boundary
        run: python3 -B scripts/verify-c84-ssh-managed-child-trusted-sample.py --selftest --check-source
      - name: Test the C8.4 trusted transcript parser
        run: python3 -B scripts/c84-ssh-managed-child-trusted-sample-peer.py --selftest
      - name: Verify the C8.4 private single-boot collector
        run: python3 -B scripts/verify-c84-ssh-managed-child-single-boot-collector.py --selftest --check-source
      - name: Test the C8.4 single-boot collector transcript parser
        run: python3 -B scripts/c84-ssh-managed-child-single-boot-collector-peer.py --selftest
      - name: Verify the independent ComponentArtifact codec
        run: python3 -B scripts/verify-c71-component-artifact.py --selftest
      - name: Verify the independent Storage V2 image parsers
        run: |
          python3 -B scripts/storage-v2-image.py --selftest
          python3 -B scripts/verify-storage-v2-cas.py --selftest
          python3 -B scripts/verify-storage-v2-gc.py --selftest
          python3 -B scripts/verify-storage-v2-maintenance.py --selftest
          python3 -B scripts/verify-storage-v2-migration.py --selftest

  c82-preview1-corpus:
    name: C8.2 source-to-execution evidence
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - name: Install repository toolchain
        run: |
          test "$(uname -m)" = arm64
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rust-src --component llvm-tools-preview \
            --target wasm32-wasip1
          rustup target add --toolchain "$toolchain" riscv64imac-unknown-none-elf
          rustup target list --toolchain "$toolchain" --installed | grep -Fx wasm32-wasip1
          rustup target list --toolchain "$toolchain" --installed \
            | grep -Fx riscv64imac-unknown-none-elf
          rustc_bin="$(rustup which --toolchain "$toolchain" rustc)"
          rustdoc_bin="$(rustup which --toolchain "$toolchain" rustdoc)"
          {
            echo "VIBEOS_TOOLCHAIN=$toolchain"
            echo "VIBEOS_RUSTC=$rustc_bin"
            echo "VIBEOS_RUSTDOC=$rustdoc_bin"
          } >> "$GITHUB_ENV"
          rustup run "$toolchain" rustc -Vv
          env RUSTC="$rustc_bin" RUSTDOC="$rustdoc_bin" \
            rustup run "$toolchain" cargo fetch --locked
          # The firmware config enables build-std. Its sysroot dependency graph
          # is target-aware and is not populated by the workspace fetch above.
          # Fetch both graphs before the corpus gate proves the build offline.
          (
            cd firmware/qemu-virt
            env RUSTC="$rustc_bin" RUSTDOC="$rustdoc_bin" \
              rustup run "$toolchain" cargo fetch --locked \
                --target riscv64imac-unknown-none-elf
          )
      - name: Install the reviewed wasi-sdk-33 toolchain
        run: |
          archive="$RUNNER_TEMP/wasi-sdk-33.0-arm64-macos.tar.gz"
          curl -L --fail --show-error \
            --output "$archive" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-arm64-macos.tar.gz
          printf '%s  %s\n' \
            85c997a2665ead91673b5bb88b7d0df3fc8900df3bfa244f720d478187bbdc78 \
            "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "C82_WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-33.0-arm64-macos" >> "$GITHUB_ENV"
      - name: Rebuild and execute the bounded Preview1 corpus
        run: ./scripts/test-c82-preview1-corpus.sh

  c88-f5-duo-readiness:
    name: C8.8-F5 Duo static compile readiness
    needs: host-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          test "$(uname -m)" = arm64
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rust-src --component llvm-tools-preview
          rustc_bin="$(rustup which --toolchain "$toolchain" rustc)"
          rustdoc_bin="$(rustup which --toolchain "$toolchain" rustdoc)"
          {
            echo "VIBEOS_TOOLCHAIN=$toolchain"
            echo "VIBEOS_RUSTC=$rustc_bin"
            echo "VIBEOS_RUSTDOC=$rustdoc_bin"
          } >> "$GITHUB_ENV"
          env RUSTC="$rustc_bin" RUSTDOC="$rustdoc_bin" \
            rustup run "$toolchain" cargo fetch --locked
          (
            cd firmware/milkv-duo
            env RUSTC="$rustc_bin" RUSTDOC="$rustdoc_bin" \
              rustup run "$toolchain" cargo fetch --locked \
                --target riscv64imac-unknown-none-elf
          )
      - name: Install the bare-metal linker
        run: |
          brew install lld
          lld_bin="$(brew --prefix lld)/bin"
          test -x "$lld_bin/ld.lld"
          echo "$lld_bin" >> "$GITHUB_PATH"
          "$lld_bin/ld.lld" --version
      - name: Cross-link and audit the inert Duo readiness ELF
        # Static compile readiness only: no packaging, QEMU, serial, or board.
        run: |
          ./scripts/build-c88-f5-duo-readiness.sh
          python3 -B scripts/verify-c88-f5-duo-readiness.py \
            --elf target/c88-f5-duo-readiness/build/riscv64imac-unknown-none-elf/release/vibeos-milkv-duo \
            --audit-output "$RUNNER_TEMP/c88-f5-duo-elf-audit.json"

  differential:
    name: Real-rustc differential oracle
    needs: [host-tests, c82-preview1-corpus]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - name: Install repository toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rust-src --component llvm-tools-preview
          {
            echo "VIBEOS_TOOLCHAIN=$toolchain"
            echo "VIBEOS_RUSTC=$(rustup which --toolchain "$toolchain" rustc)"
            echo "VIBEOS_RUSTDOC=$(rustup which --toolchain "$toolchain" rustdoc)"
          } >> "$GITHUB_ENV"
          rustup run "$toolchain" rustc -Vv
          rustup run "$toolchain" cargo -V
      - name: Compare the corpus with real rustc
        run: ./scripts/differential.sh

  qemu-tests:
    name: QEMU integration
    needs: differential
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rust-src --component llvm-tools-preview
          rustc_bin="$(rustup which --toolchain "$toolchain" rustc)"
          rustdoc_bin="$(rustup which --toolchain "$toolchain" rustdoc)"
          {
            echo "VIBEOS_TOOLCHAIN=$toolchain"
            echo "VIBEOS_RUSTC=$rustc_bin"
            echo "VIBEOS_RUSTDOC=$rustdoc_bin"
          } >> "$GITHUB_ENV"
          rustup run "$toolchain" rustc -Vv
          rustup run "$toolchain" cargo -V
          env RUSTC="$rustc_bin" RUSTDOC="$rustdoc_bin" \
            rustup run "$toolchain" cargo fetch --locked
          # The QEMU and Duo builds inherit firmware/.cargo/config.toml's
          # build-std graph. Populate its target-aware sysroot dependencies
          # before every later build proves the source closure offline.
          (
            cd firmware/qemu-virt
            env RUSTC="$rustc_bin" RUSTDOC="$rustdoc_bin" \
              rustup run "$toolchain" cargo fetch --locked \
                --target riscv64imac-unknown-none-elf
          )
      - name: Install QEMU and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc lld
          # Cargo's rustflags name `ld.lld`; Ubuntu ships it as lld-<version>.
          sudo ln -sf "$(command -v lld)" /usr/local/bin/ld.lld
          qemu-system-riscv64 --version
          ld.lld --version
      - name: Cross-link the inert C8.8-F5 Milk-V Duo readiness ELF
        # Compile-only: no packaging, serial access, boot, or physical claim.
        run: ./scripts/build-c88-f5-duo-readiness.sh
      - name: Exercise the C8.4 kernel profile-slot ownership boundary
        run: ./scripts/qemu-c84-profile-slot-test.sh
      - name: Exercise the C8.4 real Core-poll observer boundary
        run: ./scripts/qemu-c84-core-poll-test.sh
      - name: Exercise the C8.4 real self-SSIP profile overlay boundary
        run: ./scripts/qemu-c84-profile-irq-overlay-test.sh
      - name: Exercise the C8.4 prepared-child lineage boundary
        run: ./scripts/qemu-c84-profile-child-delegation-test.sh
      - name: Exercise the C8.4 authenticated SSH request-parent boundary
        run: ./scripts/qemu-c84-ssh-request-parent-test.sh
      - name: Exercise the C8.4 authenticated managed-child/Core boundary
        run: ./scripts/qemu-c84-ssh-managed-child-core-test.sh
      - name: Exercise the C8.4 SSH managed-child phase sidecar
        run: ./scripts/qemu-c84-ssh-managed-child-phase-sidecar-test.sh
      - name: Exercise the C8.4 SSH managed-child IRQ-overlay composition
        run: ./scripts/qemu-c84-ssh-managed-child-irq-overlay-test.sh
      - name: Exercise the C8.4 SSH managed-child finish/verify closure
        run: ./scripts/qemu-c84-ssh-managed-child-finish-verify-test.sh
      - name: Exercise the C8.4 SSH managed-child verified-stream closure
        run: ./scripts/qemu-c84-ssh-managed-child-verified-stream-test.sh
      - name: Exercise the C8.4 SSH managed-child trusted-sample closure
        run: ./scripts/qemu-c84-ssh-managed-child-trusted-sample-test.sh
      - name: Exercise the C8.4 private single-boot collector closure
        run: ./scripts/qemu-c84-ssh-managed-child-single-boot-collector-test.sh
      # Keep these closed-source-state gates before the ordinary Duo build,
      # which applies the reviewed jitterentropy patch inside its submodule.
      # Materialize C8.4 before C8.3 changes the operator checkout's submodule.
      # The artifact is not retained or executed; physical evidence additionally
      # requires a real board capture and cold boot.
      - name: Type/link-check the C8.4 physical single-boot collector
        run: |
          source_commit="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$source_commit"
          challenge="$(openssl rand -hex 32)"
          frozen="$RUNNER_TEMP/vibeos-c84-frozen-$challenge"
          python3 -B scripts/c84-source-materialization.py materialize \
            --source "$GITHUB_WORKSPACE" \
            --destination "$frozen" \
            --source-commit "$source_commit" \
            --challenge "$challenge"
          cd "$frozen"
          RUSTC_WRAPPER="$(command -v false)" \
          CARGO_PROFILE_RELEASE_OPT_LEVEL=0 \
          RUSTFLAGS='--c84-ambient-rustflags-must-not-leak' \
          VIBEOS_C84_SOURCE_COMMIT="$source_commit" \
          VIBEOS_C84_CHALLENGE="$challenge" \
            ./scripts/build-milkv-duo.sh --wasm-aot-profile
      - name: Build the isolated Milk-V Duo C8.3 sampler (CI-only identity)
        run: |
          VIBEOS_C83_SOURCE_COMMIT="$(git rev-parse HEAD)" \
          VIBEOS_C83_CHALLENGE=8383838383838383838383838383838383838383838383838383838383838383 \
            ./scripts/build-milkv-duo.sh --runtime-costs
      - name: Build the Milk-V Duo kernel
        # FIT/full-card packaging still requires a prebuilt official SDK and
        # remains part of the documented manual hardware acceptance flow.
        run: ./scripts/build-milkv-duo.sh
      - name: Build the Milk-V Duo diagnostic image
        run: ./scripts/build-milkv-duo.sh --diagnostic
      - name: Build the Milk-V Duo SSH acceptance image
        run: ./scripts/build-milkv-duo.sh --ssh-acceptance
      - name: Build the Milk-V Duo Jitterentropy probe
        run: ./scripts/build-milkv-duo.sh --jitterentropy-probe
      - name: Golden transcripts
        run: ./scripts/qemu-test.sh
      - name: PCI and XHCI USB acceptance
        run: ./scripts/qemu-usb-test.sh
      - name: QEMU/TCG benchmark regression budget
        run: python3 scripts/bench.py --no-build
      - name: Four-hart throughput scaling
        run: python3 -B scripts/bench.py --no-build --smp-scaling
