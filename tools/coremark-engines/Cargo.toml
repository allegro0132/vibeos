[package]
name = "vibeos-coremark-engines"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[features]
compiled = ["dep:wasmtime", "dep:wasmtime-wasi"]
compiled-threads = ["compiled", "wasmtime/threads"]
[[bin]]
name = "wasmtime-threads"
path = "src/bin/wasmtime-threads.rs"
required-features = ["compiled-threads"]
[[bin]]
name = "wasmtime"
path = "src/bin/wasmtime.rs"
required-features = ["compiled"]
[dependencies]
vibeos-wasi-runtime = { path = "../../wasi-runtime" }
wasmtime = { optional = true, version = "=48.0.0", default-features = false, features = ["std", "runtime", "cranelift"] }
wasmtime-wasi = { optional = true, version = "=48.0.0", default-features = false, features = ["p1"] }
[profile.release]
panic = "abort"
lto = true
opt-level = "z"
debug = true
[profile.release.package.vibeos-wasmi-softfloat]
opt-level = 3
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("instruction-profile"))'] }

# Same RISC-V correctness fixes as VibeOS (fs1 ABI and scalar inline copy).
# Keep the standard Wasmtime runtime, Linux memory/traps and OS threads.
[patch.crates-io]
cranelift-codegen = { path = "../../vendor/wasmtime-48/cranelift-codegen" }
wasmtime-internal-cranelift = { path = "../../vendor/wasmtime-48/wasmtime-cranelift" }
