name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - name: Install repository toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rust-src --component llvm-tools-preview
          {
            echo "VIBEOS_TOOLCHAIN=$toolchain"
            echo "VIBEOS_RUSTC=$(rustup which --toolchain "$toolchain" rustc)"
            echo "VIBEOS_RUSTDOC=$(rustup which --toolchain "$toolchain" rustdoc)"
          } >> "$GITHUB_ENV"
          rustup run "$toolchain" rustc -Vv
          rustup run "$toolchain" cargo -V
      - name: Test the portable core, compiler, and Sunset fork
        # The kernel archive and final firmware binaries are no_std; their
        # tests run inside QEMU in the job below.
        run: |
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test --workspace \
              --exclude vibeos-kernel \
              --exclude vibeos-firmware-qemu-virt \
              --exclude vibeos-firmware-milkv-duo --verbose
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test \
              --manifest-path vendor/sunset/Cargo.toml -p sunset \
              --no-default-features --features alloc --verbose
      - name: Test the native async state-machine evidence
        # The kernel library has `test = false`, but this model deliberately
        # has no kernel dependencies and is a portable host evidence layer.
        # The component-runtime fuzzer is feature-gated, so the workspace's
        # default test command above does not discover it.
        run: |
          "$VIBEOS_RUSTC" --edition=2021 --test \
            kernel/src/native_pending_shadow_model.rs \
            -o "$RUNNER_TEMP/native-pending-shadow-model"
          "$RUNNER_TEMP/native-pending-shadow-model"
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test \
              -p vibeos-component-runtime \
              --features native-async-acceptance \
              --test native_async_fuzz --verbose
      - name: Test each image policy independently
        run: |
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test --locked \
              -p vibeos-image-policy --no-default-features \
              --features qemu-default --verbose
          RUSTC="$VIBEOS_RUSTC" RUSTDOC="$VIBEOS_RUSTDOC" \
            rustup run "$VIBEOS_TOOLCHAIN" cargo test --locked \
              -p vibeos-image-policy --no-default-features \
              --features milkv-duo-sd --verbose
      - name: Report repository status
        run: ./scripts/status.sh --check
      - name: Exercise SMP benchmark transcript validation
        run: python3 -B scripts/bench.py --selftest
      - name: Verify the independent C8.3 runtime-cost evidence boundary
        run: |
          python3 -B scripts/verify-c83-runtime-costs.py --selftest --check-manifest
          python3 -B scripts/capture-c83-duo-runtime-costs.py --selftest
          python3 -B scripts/verify-c83-evidence.py --selftest
      - name: Verify the frozen C8.4 AOT decision contract
        run: python3 -B scripts/verify-c84-aot-decision.py --selftest --check-manifest
      - name: Verify the independent ComponentArtifact codec
        run: python3 -B scripts/verify-c71-component-artifact.py --selftest
      - name: Verify the independent Storage V2 image parsers
        run: |
          python3 -B scripts/storage-v2-image.py --selftest
          python3 -B scripts/verify-storage-v2-cas.py --selftest
          python3 -B scripts/verify-storage-v2-gc.py --selftest
          python3 -B scripts/verify-storage-v2-maintenance.py --selftest
          python3 -B scripts/verify-storage-v2-migration.py --selftest
          ./scripts/verify-milkv-duo-image.sh --selftest

  c82-preview1-corpus:
    name: C8.2 source-to-execution evidence
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - name: Install repository toolchain
        run: |
          test "$(uname -m)" = arm64
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rust-src --component llvm-tools-preview \
            --target wasm32-wasip1
          rustup target add --toolchain "$toolchain" riscv64imac-unknown-none-elf
          rustup target list --toolchain "$toolchain" --installed | grep -Fx wasm32-wasip1
          rustup target list --toolchain "$toolchain" --installed \
            | grep -Fx riscv64imac-unknown-none-elf
          rustc_bin="$(rustup which --toolchain "$toolchain" rustc)"
          rustdoc_bin="$(rustup which --toolchain "$toolchain" rustdoc)"
          {
            echo "VIBEOS_TOOLCHAIN=$toolchain"
            echo "VIBEOS_RUSTC=$rustc_bin"
            echo "VIBEOS_RUSTDOC=$rustdoc_bin"
          } >> "$GITHUB_ENV"
          rustup run "$toolchain" rustc -Vv
          env RUSTC="$rustc_bin" RUSTDOC="$rustdoc_bin" \
            rustup run "$toolchain" cargo fetch --locked
          # The firmware config enables build-std. Its sysroot dependency graph
          # is target-aware and is not populated by the workspace fetch above.
          # Fetch both graphs before the corpus gate proves the build offline.
          (
            cd firmware/qemu-virt
            env RUSTC="$rustc_bin" RUSTDOC="$rustdoc_bin" \
              rustup run "$toolchain" cargo fetch --locked \
                --target riscv64imac-unknown-none-elf
          )
      - name: Install the reviewed wasi-sdk-33 toolchain
        run: |
          archive="$RUNNER_TEMP/wasi-sdk-33.0-arm64-macos.tar.gz"
          curl -L --fail --show-error \
            --output "$archive" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-arm64-macos.tar.gz
          printf '%s  %s\n' \
            85c997a2665ead91673b5bb88b7d0df3fc8900df3bfa244f720d478187bbdc78 \
            "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "C82_WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-33.0-arm64-macos" >> "$GITHUB_ENV"
      - name: Rebuild and execute the bounded Preview1 corpus
        run: ./scripts/test-c82-preview1-corpus.sh

  differential:
    name: Real-rustc differential oracle
    needs: [host-tests, c82-preview1-corpus]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - name: Install repository toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rust-src --component llvm-tools-preview
          {
            echo "VIBEOS_TOOLCHAIN=$toolchain"
            echo "VIBEOS_RUSTC=$(rustup which --toolchain "$toolchain" rustc)"
            echo "VIBEOS_RUSTDOC=$(rustup which --toolchain "$toolchain" rustdoc)"
          } >> "$GITHUB_ENV"
          rustup run "$toolchain" rustc -Vv
          rustup run "$toolchain" cargo -V
      - name: Compare the corpus with real rustc
        run: ./scripts/differential.sh

  qemu-tests:
    name: QEMU integration
    needs: differential
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - name: Install repository toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal \
            --component rust-src --component llvm-tools-preview
          rustc_bin="$(rustup which --toolchain "$toolchain" rustc)"
          rustdoc_bin="$(rustup which --toolchain "$toolchain" rustdoc)"
          {
            echo "VIBEOS_TOOLCHAIN=$toolchain"
            echo "VIBEOS_RUSTC=$rustc_bin"
            echo "VIBEOS_RUSTDOC=$rustdoc_bin"
          } >> "$GITHUB_ENV"
          rustup run "$toolchain" rustc -Vv
          rustup run "$toolchain" cargo -V
          env RUSTC="$rustc_bin" RUSTDOC="$rustdoc_bin" \
            rustup run "$toolchain" cargo fetch --locked
          # The QEMU and Duo builds inherit firmware/.cargo/config.toml's
          # build-std graph. Populate its target-aware sysroot dependencies
          # before every later build proves the source closure offline.
          (
            cd firmware/qemu-virt
            env RUSTC="$rustc_bin" RUSTDOC="$rustdoc_bin" \
              rustup run "$toolchain" cargo fetch --locked \
                --target riscv64imac-unknown-none-elf
          )
      - name: Install QEMU and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc lld
          # Cargo's rustflags name `ld.lld`; Ubuntu ships it as lld-<version>.
          sudo ln -sf "$(command -v lld)" /usr/local/bin/ld.lld
          qemu-system-riscv64 --version
          ld.lld --version
      # Keep both closed-source-state gates before the ordinary Duo build,
      # which applies the reviewed jitterentropy patch inside its submodule.
      - name: Build the isolated Milk-V Duo C8.3 sampler (CI-only identity)
        run: |
          VIBEOS_C83_SOURCE_COMMIT="$(git rev-parse HEAD)" \
          VIBEOS_C83_CHALLENGE=8383838383838383838383838383838383838383838383838383838383838383 \
            ./scripts/build-milkv-duo.sh --runtime-costs
      # This exercises the formal gates with a fresh challenge, but CI does not
      # retain its outputs and therefore cannot complete the evidence milestone.
      - name: Exercise the fixed-QEMU C8.3 publication contract
        run: python3 -B scripts/qemu-c83-runtime-costs.py
      - name: Build the Milk-V Duo kernel
        # FIT/full-card packaging still requires a prebuilt official SDK and
        # remains part of the documented manual hardware acceptance flow.
        run: ./scripts/build-milkv-duo.sh
      - name: Build the Milk-V Duo diagnostic image
        run: ./scripts/build-milkv-duo.sh --diagnostic
      - name: Build the Milk-V Duo SSH acceptance image
        run: ./scripts/build-milkv-duo.sh --ssh-acceptance
      - name: Build the Milk-V Duo Jitterentropy probe
        run: ./scripts/build-milkv-duo.sh --jitterentropy-probe
      - name: Golden transcripts
        run: ./scripts/qemu-test.sh
      - name: PCI and XHCI USB acceptance
        run: ./scripts/qemu-usb-test.sh
      - name: QEMU/TCG benchmark regression budget
        run: python3 scripts/bench.py --no-build
      - name: Four-hart throughput scaling
        run: python3 -B scripts/bench.py --no-build --smp-scaling
