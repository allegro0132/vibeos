[package]
name = "vibeos-vsh"
version = "0.1.0"
edition = "2021"

[features]
default = ["pci-usb-help"]
pci-usb-help = []
network = []
# Target-only aggregate visibility for the standard managed-component QEMU
# acceptance gate. Normal VSH and physical images expose no reaper snapshot.
managed-component-target-acceptance = []

[dependencies]
vibeos-core = { path = "../../core" }
vibeos-component-host = { path = "../../services/component-host" }
