[package]
name = "vibeos-core"
version = "0.1.0"
edition = "2021"

[features]
# Target-only fault-gate corruption/probe hooks used by the C4.8 QEMU
# acceptance image. Production profiles must not enable this feature.
wasm-c48-target-acceptance = []

[dependencies]
vibeos-durable-format = { path = "../durable-format" }
vibeos-hal = { path = "../hal" }

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
vibeos-runtime-riscv = { path = "../runtime/riscv" }
