[package]
name = "vibeos-kernel"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = ["qemu-virt", "qemu-default-image"]
qemu-virt = ["dep:vibeos-bsp-qemu-virt", "dep:vibeos-driver-pci", "dep:vibeos-driver-virtio-blk", "dep:vibeos-driver-virtio-core", "dep:vibeos-driver-virtio-mmio", "dep:vibeos-driver-virtio-net", "dep:vibeos-driver-virtio-rng", "dep:vibeos-driver-xhci", "vibeos-vsh/pci-usb-help"]
milkv-duo = ["dep:vibeos-bsp-milkv-duo", "dep:vibeos-driver-dwmac-net", "dep:vibeos-driver-dwc2-host", "dep:vibeos-driver-milkv-duo-led", "dep:vibeos-driver-sdhci-blk"]
qemu-default-image = ["vibeos-image-policy/qemu-default"]
milkv-duo-sd-image = ["vibeos-image-policy/milkv-duo-sd"]
legacy-shell = []
# Dedicated N1 acceptance image: static IPv4 plus one bounded TCP echo
# listener. This is deliberately separate from the eventual SSH feature so a
# byte-stream transport can be proved before cryptographic code is admitted.
tcp-echo = ["dep:vibeos-net-api", "dep:vibeos-net-echo", "dep:vibeos-netstack", "vibeos-netstack/tcp-echo", "vibeos-vsh/network"]
# Production Milk-V Duo IPv4 control plane. It owns the raw packet endpoints,
# starts in DHCP mode, and exposes only capability-admitted ip/dhclient commands.
net-shell = ["dep:vibeos-net-api", "dep:vibeos-net-echo", "dep:vibeos-netstack", "vibeos-netstack/net-shell", "vibeos-vsh/network"]
# Test-only recovery hook used by the live stack-generation acceptance script.
# It is never enabled by the normal TCP or eventual SSH image.
tcp-echo-recovery-test = ["tcp-echo", "vibeos-netstack/tcp-echo-recovery-test"]
# Dedicated N3 acceptance image. It exercises the real virtio-rng capability,
# a test-only provisioned host signer, and an immutable binary auth policy.
ssh-security-test = [
    "dep:vibeos-ssh-identity",
    "vibeos-kernel-acceptance/ssh-security-test",
]
# Dedicated N4 acceptance image. Sunset is admitted only for this QEMU image
# and retains its no-std surface with allocation support for connection state.
ssh-test = [
    "dep:vibeos-net-api",
    "dep:vibeos-netstack",
    "dep:vibeos-sshd",
    "dep:vibeos-ssh-identity",
    "vibeos-kernel-acceptance/ssh-test-fixture",
    "vibeos-netstack/static-service",
]
# Explicitly insecure physical bring-up image. It reuses the fixed SSH test
# identities and a deterministic acceptance-only random service so DWMAC,
# DHCP, OpenSSH, and interactive VSH can be validated before a real Duo entropy
# and provisioning path exists. Never enable this feature in a production image.
milkv-ssh-acceptance = [
    "dep:vibeos-net-api",
    "dep:vibeos-netstack",
    "dep:vibeos-sshd",
    "dep:vibeos-ssh-identity",
    "vibeos-kernel-acceptance/milkv-ssh-acceptance",
    "vibeos-netstack/dhcp-service",
    "vibeos-vsh/network",
]
# Production SSH image. Device and client identities are provisioned locally;
# no acceptance fixture is linked into this feature.
milkv-ssh = [
    "dep:vibeos-net-api",
    "dep:vibeos-netstack",
    "dep:vibeos-sshd",
    "dep:vibeos-ssh-identity",
    "dep:jitterentropy",
    "vibeos-netstack/dhcp-service",
    "vibeos-vsh/network",
]
# Dedicated hardware qualification image for jitterentropy-rs. It exposes a
# conditioned smoke test through the UART shell, but is not wired into SSH
# until the Rust rewrite's validation and independent review gates have passed.
milkv-jitterentropy-probe = ["legacy-shell", "dep:jitterentropy", "jitterentropy/raw-noise"]
# Qualification-only network image. It deliberately inherits the visibly
# insecure physical SSH acceptance identity/RNG fixtures and adds a bounded,
# streaming raw-delta exec path that bypasses normal VSH output capture.
milkv-jitterentropy-ssh-probe = [
    "milkv-ssh-acceptance",
    "dep:jitterentropy",
    "jitterentropy/raw-noise",
    "vibeos-sshd/qualification-stream",
]

# The kernel is a reusable `no_std` archive selected and linked by a board
# firmware package. Its hardware cases live in `selftest_platform.rs` and run
# inside QEMU; portable acceptance policy lives in `acceptance/kernel-tests`.
[lib]
name = "vibeos_kernel"
path = "src/lib.rs"
test = false
bench = false

[dependencies]
vibeos-bsp-milkv-duo = { path = "../boards/milkv-duo", optional = true }
vibeos-bsp-qemu-virt = { path = "../boards/qemu-virt", optional = true }
vibeos-core = { path = "../core" }
vibeos-durable-format = { path = "../durable-format" }
vibeos-driver-dwmac-net = { path = "../drivers/dwmac-net", optional = true }
vibeos-driver-dwc2-host = { path = "../drivers/dwc2-host", optional = true }
vibeos-driver-milkv-duo-led = { path = "../drivers/milkv-duo-led", optional = true }
vibeos-driver-pci = { path = "../drivers/pci", optional = true }
vibeos-driver-sdhci-blk = { path = "../drivers/sdhci-blk", optional = true }
vibeos-driver-virtio-blk = { path = "../drivers/virtio-blk", optional = true }
vibeos-driver-virtio-core = { path = "../drivers/virtio-core", optional = true }
vibeos-driver-virtio-mmio = { path = "../drivers/virtio-mmio", optional = true }
vibeos-driver-virtio-net = { path = "../drivers/virtio-net", optional = true }
vibeos-driver-virtio-rng = { path = "../drivers/virtio-rng", optional = true }
vibeos-driver-xhci = { path = "../drivers/xhci", optional = true }
vibeos-hal = { path = "../hal" }
vibeos-image-policy = { path = "../policy/image", default-features = false }
vibeos-rustc = { path = "../compiler" }
vibeos-segment-format = { path = "../segment-format" }
vibeos-segment-store = { path = "../segment-store" }
vibeos-storage-device = { path = "../storage-device" }
vibeos-authority-store = { path = "../services/authority-store" }
vibeos-kernel-acceptance = { path = "../acceptance/kernel-tests" }
vibeos-net-api = { path = "../components/net-api", optional = true }
vibeos-net-echo = { path = "../components/net-echo", optional = true }
vibeos-netstack = { path = "../components/netstack", default-features = false, optional = true }
vibeos-object-store = { path = "../services/object-store" }
vibeos-program-store = { path = "../services/program-store" }
vibeos-random = { path = "../random" }
vibeos-sshd = { path = "../components/sshd", default-features = false, optional = true }
vibeos-ssh-identity = { path = "../services/ssh-identity", optional = true }
vibeos-vsh = { path = "../components/vsh", default-features = false }
jitterentropy = { package = "jitterentropy-rs", path = "../vendor/jitterentropy-rs", default-features = false, features = ["alloc"], optional = true }

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
vibeos-runtime-riscv = { path = "../runtime/riscv" }
