[package]
name = "vibeos-image-policy"
version = "0.1.0"
edition = "2021"

[dependencies]
vibeos-component-admission = { path = "../../services/component-admission", optional = true }
vibeos-component-format = { path = "../../component-format" }

[features]
default = ["qemu-default"]
qemu-default = []
milkv-duo-sd = []
c53-native-async-qemu-acceptance = []
c53-native-async-command-projection = []
c64-resource-route-qemu-acceptance = []
c65-async-chain-qemu-acceptance = []
c66-node-replacement-qemu-acceptance = []
c67-information-flow-qemu-acceptance = []
c73-authenticated-admission-qemu-acceptance = ["dep:vibeos-component-admission"]
c76-graph-version-replacement-qemu-acceptance = ["dep:vibeos-component-admission"]
file-tree = []
storage-bench = []

[build-dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
vibeos-component-admission = { path = "../../services/component-admission" }
vibeos-component-format = { path = "../../component-format" }
vibeos-component-runtime = { path = "../../component-runtime" }
wat = { version = "=1.255.0", features = ["component-model"] }

[dev-dependencies]
sha2 = { version = "=0.11.0", default-features = false }
vibeos-component-admission = { path = "../../services/component-admission", features = ["native-async-acceptance"] }
vibeos-component-command = { path = "../../services/component-command" }
vibeos-component-loader = { path = "../../services/component-loader" }
vibeos-component-runtime = { path = "../../component-runtime", features = ["c84-profile-hooks"] }
vibeos-wasm-runtime = { path = "../../wasm-runtime" }
wat = { version = "=1.255.0", features = ["component-model"] }
