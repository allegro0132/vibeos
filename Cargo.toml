[workspace]
resolver = "2"
members = ["firmware/qemu-hal-test", "contracts/virtio", "platform/cv1800b", "wasm-rv64", "services/wasi-command", "wasi-runtime", "blob-format", "component-format", "component-runtime", "wasm-aot-profile", "wasm-candidates", "wasm-float-candidate", "wasm-reference-candidate", "wasm-reference-executable", "wasm-simd-candidate", "wasm-simd-executable", "wasmi-reference-executable", "wasmi-reference-validation", "wasmi-simd-executable-softfloat", "wasm-runtime", "storage-device", "segment-format", "segment-store", "durable-format", "random", "runtime/riscv", "core", "compiler", "hal", "boards/qemu-virt", "boards/milkv-duo", "boards/milkv-mars", "drivers/dw-mshc", "drivers/sd-protocol", "drivers/uart16550", "drivers/plic", "drivers/dwmac-net", "drivers/dwc2-host", "drivers/rtl815x", "drivers/milkv-duo-led", "drivers/pci", "drivers/sdhci-blk", "drivers/virtio-blk", "drivers/virtio-core", "drivers/virtio-mmio", "drivers/virtio-net", "drivers/virtio-rng", "drivers/xhci", "components/iperf3-server", "components/net-api", "components/net-echo", "components/net-protocol", "components/netstack", "components/sshd", "components/vsh", "services/authority-store", "services/component-admission", "services/component-command", "services/component-host", "services/component-image-adapter", "services/component-loader", "services/file-store", "services/object-store", "services/program-store", "services/ssh-identity", "policy/image", "acceptance/kernel-tests", "acceptance/wasm-runtime-costs", "acceptance/wasm-float-target", "acceptance/wasm-reference-target", "acceptance/wasm-simd-target", "kernel", "firmware/qemu-virt", "firmware/milkv-duo", "tools/c81-preview1-componentizer", "tools/c82-preview1-corpus"]
exclude = ["wasmtime-runtime", "vendor/sunset", "vendor/wasmi-softfloat", "vendor/wasmi-simd-softfloat"]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
debug = true

# The interpreter dispatch loop is a throughput-critical hot path. Keep its
# safety checks and fuel accounting, but compile it for speed rather than size.
[profile.release.package.vibeos-wasmi-softfloat]
opt-level = 3
# Dispatch, capability lookup and allocation-domain transitions run at every
# guest quantum, so keep these shared kernel primitives speed-optimized too.
[profile.release.package.vibeos-core]
opt-level = 3

# The size-optimized kernel profile keeps the image small, but the storage
# stack's software SHA-256 and codec loops are latency-critical on the
# durable put/get path (and painfully slow under TCG emulation at -Oz).
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.digest]
opt-level = 3
[profile.release.package.block-buffer]
opt-level = 3
[profile.release.package.vibeos-segment-store]
opt-level = 3
[profile.release.package.vibeos-durable-format]
opt-level = 3
[profile.release.package.vibeos-segment-format]
opt-level = 3
[profile.release.package.vibeos-blob-format]
opt-level = 3

[patch.crates-io]
cranelift-codegen = { path = "vendor/wasmtime-48/cranelift-codegen" }
wasmtime = { path = "vendor/wasmtime-48/wasmtime" }
wasmtime-internal-cranelift = { path = "vendor/wasmtime-48/wasmtime-cranelift" }
wasmtime-environ = { path = "vendor/wasmtime-48/wasmtime-environ" }

[profile.release.package.wasmtime]
opt-level = 3
[profile.release.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.release.package.cranelift-codegen]
opt-level = 3
