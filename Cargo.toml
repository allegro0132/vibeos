[workspace]
resolver = "2"
members = ["core", "compiler", "components/netstack", "components/sshd", "components/vsh", "services/ssh-identity", "kernel"]
exclude = ["vendor/sunset"]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
debug = true
