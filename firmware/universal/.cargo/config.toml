[target.riscv64imac-unknown-none-elf]
rustflags = [
  "-C", "linker=ld.lld",
  "-C", "linker-flavor=ld",
  # The built-in IMAC target is integer-only (`lp64`). CSR access and fence.i
  # are still architectural kernel requirements and do not change that ABI.
  "-C", "target-feature=+zicsr,+zifencei",
  "-C", "link-arg=--gc-sections",
  "-C", "force-frame-pointers=yes",
  "-C", "relocation-model=pic",
  "-C", "link-arg=--no-relax",
]
runner = "qemu-system-riscv64 -machine virt -cpu rv64 -smp 1 -m 128M -nographic -bios default -kernel"

# Experimental LP64D kernel target for the Wasmtime native integration.
[target.riscv64gc-unknown-none-elf]
rustflags = [
  "-C", "linker=ld.lld",
  "-C", "linker-flavor=ld",
  "-C", "link-arg=--gc-sections",
  "-C", "force-frame-pointers=yes",
  "-C", "relocation-model=pic",
  "-C", "link-arg=--no-relax",
]
