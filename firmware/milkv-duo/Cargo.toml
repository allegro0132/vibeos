[package]
name = "vibeos-firmware-milkv-duo"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["milkv-ssh"]
net-shell = ["vibeos-kernel/net-shell"]
milkv-iperf3-server = ["vibeos-kernel/milkv-iperf3-server"]
milkv-ssh = ["vibeos-kernel/milkv-ssh"]
file-tree = ["vibeos-kernel/file-tree"]
legacy-shell = ["vibeos-kernel/legacy-shell"]
milkv-ssh-acceptance = ["vibeos-kernel/milkv-ssh-acceptance"]
milkv-jitterentropy-probe = ["vibeos-kernel/milkv-jitterentropy-probe"]
milkv-jitterentropy-ssh-probe = ["vibeos-kernel/milkv-jitterentropy-ssh-probe"]
wasm-c83-runtime-costs = ["vibeos-kernel/wasm-c83-runtime-costs"]
wasm-c84-profile-slot = ["vibeos-kernel/wasm-c84-profile-slot"]
wasm-c84-core-poll-observer = ["vibeos-kernel/wasm-c84-core-poll-observer"]
wasm-c84-profile-irq-overlay = ["vibeos-kernel/wasm-c84-profile-irq-overlay"]
wasm-c84-profile-child-delegation = ["vibeos-kernel/wasm-c84-profile-child-delegation"]
wasm-c84-ssh-request-parent = ["vibeos-kernel/wasm-c84-ssh-request-parent"]
wasm-c84-ssh-managed-child-core = ["vibeos-kernel/wasm-c84-ssh-managed-child-core"]
wasm-c84-ssh-managed-child-phase-sidecar = ["vibeos-kernel/wasm-c84-ssh-managed-child-phase-sidecar"]

[[bin]]
name = "vibeos-milkv-duo"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vibeos-kernel = { path = "../../kernel", default-features = false, features = ["milkv-duo", "milkv-duo-sd-image"] }
