[package]
name = "vibeos-net-protocol"
version = "0.1.0"
edition = "2021"

[features]
network-tx-audit = ["vibeos-core/network-tx-audit"]
native-tcp-segmentation = ["smoltcp/tcp-segmentation"]
# Experimental bounded IPv4/TCP receive coalescing; disabled by default.
bounded-gro = []
tcp-large-window = []

[dependencies]
smoltcp = { version = "=0.13.1", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "auto-icmp-echo-reply",
    "socket-dhcpv4",
    "socket-tcp",
    "socket-tcp-reno",
] }
vibeos-core = { path = "../../core" }
vibeos-net-api = { path = "../net-api" }
