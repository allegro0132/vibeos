[package]
name = "vibeos-sshd"
version = "0.1.0"
edition = "2021"

[features]
default = []
qualification-stream = []

[dependencies]
vibeos-core = { path = "../../core" }
vibeos-component-host = { path = "../../services/component-host" }
vibeos-component-runtime = { path = "../../component-runtime" }
vibeos-net-api = { path = "../net-api" }
vibeos-net-protocol = { path = "../net-protocol" }
vibeos-random = { path = "../../random" }
vibeos-ssh-identity = { path = "../../services/ssh-identity" }
vibeos-vsh = { path = "../vsh", default-features = false }
sunset = { path = "../../vendor/sunset", default-features = false, features = ["alloc"] }

[dev-dependencies]
vibeos-component-admission = { path = "../../services/component-admission" }
vibeos-component-command = { path = "../../services/component-command" }
vibeos-image-policy = { path = "../../policy/image" }
