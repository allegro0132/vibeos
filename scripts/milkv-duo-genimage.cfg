image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"fip.bin",
			"rawimages/boot.sd",
		}
	}
	size = 128M
}

image vibeos-milkv-duo-sd.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	# Raw block service partition. The kernel translates this partition's first
	# LBA to logical sector zero; no filesystem is placed here.
	partition vibe-data {
		partition-type = 0xDA
		image = "vibe-data.bin"
	}
}
